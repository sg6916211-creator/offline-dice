<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.png">
  <title>Verify - Offline Dice</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700;800;900&family=Lilita+One&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #000; color: #fff; font-family: 'Fredoka', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; text-align: center; }
    .verify-card { background: rgba(20,20,26,0.9); border: 2px solid #00D2FF; border-radius: 18px; padding: 30px; max-width: 480px; width: 100%; }
    h1 { font-family: 'Lilita One', cursive; color: #00D2FF; font-size: 28px; letter-spacing: 2px; margin: 0 0 10px; }
    p { color: #ccc; line-height: 1.5; margin: 8px 0; }
    .game-id { font-family: 'Fredoka', sans-serif; font-weight: 800; font-size: 22px; color: #FFEA3D; letter-spacing: 2px; word-break: break-all; }
    .back-link { display: inline-block; margin-top: 20px; color: #fff; background: linear-gradient(180deg,#FFEA3D,#FF9800); border-radius: 12px; padding: 12px 24px; text-decoration: none; font-weight: 800; font-family: 'Luckiest Guy', cursive; letter-spacing: 1.5px; }
  </style>
</head>
<body>
  <div class="verify-card">
    <h1>ROLL VERIFICATION</h1>
    <p>Every roll on Offline Dice is generated by a cryptographically secure server-side engine (CSPRNG) and recorded to our live database.</p>
    <p>Game ID:</p>
    <div class="game-id" id="gameId">-</div>
    <p>You can confirm the fairness of a roll by checking its hash against the public ledger.</p>
    <a class="back-link" href="index.html">BACK TO DICE</a>
  </div>
  <script>
    var q = new URLSearchParams(window.location.search).get('game') || new URLSearchParams(window.location.search).get('id') || '-';
    document.getElementById('gameId').textContent = q;
  </script>
</body>
</html>
